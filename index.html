<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <main class="container py-5">
      <section class="mb-5">
        <h2>Find a Recipe</h2>

        <div class="d-flex gap-2 mb-3">
          <input
            id="recipe-id"
            type="number"
            class="form-control"
            value="1"
            min="1"
          />
          <button id="get-btn" class="btn btn-dark">Get Recipe</button>
        </div>

        <p id="status" class="fw-bold text-danger"></p>

        <div id="recipe"></div>
      </section>

      <section>
        <h2>Add a dish</h2>

        <div class="d-flex gap-2 mb-3">
          <input
            id="dish-name"
            type="text"
            class="form-control"
            placeholder="New dish name"
          />
          <button id="post-btn" class="btn btn-warning">Add it</button>
        </div>

        <p id="post-status" class="fw-bold text-danger"></p>

        <div id="saved"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
